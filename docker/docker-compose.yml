# Runs the web client, the API, MongoDB, Prometheus, and Grafana together.
# Usage from the repo root: docker compose -f docker/docker-compose.yml up -d --build
services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: campus-works-api:latest
    ports:
      - "3000:3000"
    env_file: ../.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/campusworks
      FRONTEND_URL: http://localhost:8080
    depends_on:
      - mongo

  web:
    build:
      context: ../frontend
    image: campus-works-web:latest
    ports:
      - "8080:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mongo-data:
  prometheus-data:
